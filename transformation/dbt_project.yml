name: 'banking_dw'
version: '1.0.0'
config-version: 2

profile: 'banking_dw'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  banking_dw:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging", "daily"]
    intermediate:
      +materialized: table
      +schema: intermediate
      +tags: ["intermediate", "daily"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts", "reporting"]
      +post-hook: "GRANT SELECT ON {{ this }} TO ROLE reporter"

vars:
  fraud_score_threshold: 0.75
  large_txn_threshold: 10000
  lookback_days: 30
